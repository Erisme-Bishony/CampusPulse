spring:
  datasource:
    url: jdbc:h2:mem:campuspulse;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expire-days: 1
